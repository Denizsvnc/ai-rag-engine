<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Secure Document Ingestion and PII Sanitization Pipeline with BullMQ and Data Sovereignty">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a14"/>
      <stop offset="50%" stop-color="#0c1224"/>
      <stop offset="100%" stop-color="#140f2d"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e184a"/>
      <stop offset="100%" stop-color="#0f1730"/>
    </linearGradient>
    <linearGradient id="accentCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#7000ff"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.04"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .t { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif; fill: #e2e8f0; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .title { font-size: 21px; font-weight: 700; fill: #ffffff; letter-spacing: -0.3px; }
    .subtitle { font-size: 12.5px; fill: #94a3b8; }
    .header-tag { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; fill: #00f0ff; }
    .box { fill: #0d152b; stroke: #263359; stroke-width: 1.5; rx: 14; }
    .box-shield { fill: url(#shieldGrad); stroke: #8b5cf6; stroke-width: 2; rx: 16; }
    .node-title { font-size: 14px; font-weight: 700; fill: #ffffff; }
    .node-sub { font-size: 11px; fill: #94a3b8; }
    .badge-pass { fill: #064e3b; stroke: #10b981; stroke-width: 1; rx: 6; }
    .badge-block { fill: #4c0519; stroke: #f43f5e; stroke-width: 1; rx: 6; }
    .badge-queue { fill: #2e1065; stroke: #a855f7; stroke-width: 1; rx: 6; }
    .wire { fill: none; stroke: #1e293b; stroke-width: 2.5; }
    .pulse-wire { fill: none; stroke-width: 2; stroke-dasharray: 6 12; animation: flow 1.2s linear infinite; }
    .pulse-slow { fill: none; stroke-width: 2; stroke-dasharray: 6 12; animation: flow 2s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -36; } }
    .radar { animation: radar 3s ease-out infinite; transform-origin: 600px 270px; }
    @keyframes radar { 0% { r: 10; opacity: 1; } 100% { r: 55; opacity: 0; } }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="560" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="560" rx="20" fill="url(#grid)"/>

  <!-- Header Banner -->
  <g transform="translate(36, 42)">
    <rect x="0" y="-8" width="170" height="20" rx="5" fill="#1e184a"/>
    <text x="8" y="6" class="t mono header-tag">PILLAR 6 · DATA PRIVACY</text>
    <text x="0" y="32" class="t title">Secure Document Ingestion &amp; PII Sanitization Pipeline</text>
    <text x="0" y="52" class="t subtitle">Zero-bloat magic byte defense (778K ops/s), algorithmic TCKN/Luhn verification (245K ops/s), BullMQ worker queue, and local sovereignty routing.</text>
  </g>

  <!-- Connection Paths (Behind nodes) -->
  <g>
    <!-- 1 -> 2 (Intake to Magic Bytes) -->
    <path class="wire" d="M 190 270 H 260"/>
    <path class="pulse-wire" stroke="#00f0ff" d="M 190 270 H 260"/>

    <!-- 2 -> 3 (Magic Bytes to PIIGuard) -->
    <path class="wire" d="M 440 270 H 500"/>
    <path class="pulse-wire" stroke="#10b981" d="M 440 270 H 500"/>

    <!-- 3 -> Upper Cloud Branch (Sovereignty Strict Mask) -->
    <path class="wire" d="M 680 230 C 720 230 730 110 770 110 H 950"/>
    <path class="pulse-wire" stroke="#f59e0b" d="M 680 230 C 720 230 730 110 770 110 H 950"/>

    <!-- 3 -> 4 (PIIGuard to BullMQ Queue) -->
    <path class="wire" d="M 700 270 H 770"/>
    <path class="pulse-wire" stroke="#8b5cf6" d="M 700 270 H 770"/>

    <!-- 4 -> 5 (BullMQ to Vector Store) -->
    <path class="wire" d="M 950 270 H 1010"/>
    <path class="pulse-wire" stroke="#00f0ff" d="M 950 270 H 1010"/>

    <!-- 3 -> Lower Local Branch (Local Ollama VPC Bypass) -->
    <path class="wire" d="M 680 310 C 720 310 730 430 770 430 H 950"/>
    <path class="pulse-slow" stroke="#3ee6a8" d="M 680 310 C 720 310 730 430 770 430 H 950"/>
  </g>

  <!-- ==================== STAGE 1: DOCUMENT INTAKE ==================== -->
  <g transform="translate(36, 175)">
    <rect class="box" width="154" height="190"/>
    <rect x="14" y="16" width="36" height="36" rx="8" fill="#172554" stroke="#3b82f6"/>
    <text x="32" y="39" class="t mono" style="font-size:18px;font-weight:700;fill:#60a5fa" text-anchor="middle">📄</text>
    <text x="14" y="74" class="t node-title">Document Intake</text>
    <text x="14" y="93" class="t node-sub">POST /api/ingest</text>
    
    <g transform="translate(14, 110)">
      <rect width="126" height="22" rx="5" fill="#0f172a"/>
      <text x="8" y="15" class="t mono" style="font-size:10px;fill:#94a3b8">PDF · TXT · MD</text>
    </g>
    <g transform="translate(14, 138)">
      <rect width="126" height="22" rx="5" fill="#0f172a"/>
      <text x="8" y="15" class="t mono" style="font-size:10px;fill:#94a3b8">CSV · JSON</text>
    </g>
  </g>

  <!-- ==================== STAGE 2: MAGIC BYTE FILTER ==================== -->
  <g transform="translate(260, 175)">
    <rect class="box" width="180" height="190" stroke="#f43f5e" stroke-width="1.8"/>
    <rect x="14" y="16" width="36" height="36" rx="8" fill="#3b0718" stroke="#f43f5e"/>
    <text x="32" y="39" class="t mono" style="font-size:18px;font-weight:700;fill:#f43f5e" text-anchor="middle">🛡️</text>
    <text x="14" y="74" class="t node-title">Magic Byte Filter</text>
    <text x="14" y="93" class="t node-sub">Pre-Flight Security Gate</text>

    <!-- Blocked badge -->
    <g transform="translate(14, 108)">
      <rect class="badge-block" width="152" height="32"/>
      <text x="8" y="15" class="t mono" style="font-size:9.5px;font-weight:700;fill:#fb7185">REJECT MALWARE &amp; SCRIPT</text>
      <text x="8" y="27" class="t mono" style="font-size:8.5px;fill:#fda4af">MZ, ELF, #!, .exe, .sh, .docm</text>
    </g>
    <text x="14" y="162" class="t mono" style="font-size:10px;fill:#10b981">✓ Pass: %PDF, UTF-8 txt</text>
  </g>

  <!-- ==================== STAGE 3: ZERO-BLOAT PII GUARD (CENTER SHIELD) ==================== -->
  <g transform="translate(500, 160)">
    <circle cx="100" cy="110" r="10" fill="none" stroke="#a855f7" stroke-width="1.5" class="radar"/>
    <rect class="box-shield" width="200" height="220"/>
    <rect x="16" y="16" width="40" height="40" rx="10" fill="#2e1065" stroke="#a855f7"/>
    <text x="36" y="42" class="t mono" style="font-size:20px;font-weight:700;fill:#c084fc" text-anchor="middle">🔒</text>
    
    <text x="16" y="78" class="t node-title" style="font-size:15px">PIIGuard Engine</text>
    <text x="16" y="96" class="t node-sub">Sub-millisecond Checksums</text>

    <g transform="translate(16, 108)">
      <rect width="168" height="24" rx="5" fill="#170f36" stroke="#4c1d95"/>
      <text x="8" y="16" class="t mono" style="font-size:10px;font-weight:700;fill:#e9d5ff">TCKN Mod-10 Checksum</text>
    </g>

    <g transform="translate(16, 138)">
      <rect width="168" height="24" rx="5" fill="#170f36" stroke="#4c1d95"/>
      <text x="8" y="16" class="t mono" style="font-size:10px;font-weight:700;fill:#e9d5ff">Credit Card Luhn Check</text>
    </g>

    <g transform="translate(16, 168)">
      <rect width="168" height="24" rx="5" fill="#170f36" stroke="#4c1d95"/>
      <text x="8" y="16" class="t mono" style="font-size:9.5px;fill:#e9d5ff">IBAN · Email · Phone Mask</text>
    </g>

    <text x="100" y="208" class="t mono" style="font-size:9.5px;font-weight:700;fill:#3ee6a8" text-anchor="middle">⚡ 245K ops/s · 4.03 µs Latency</text>
  </g>

  <!-- ==================== UPPER BRANCH: CLOUD LLM SOVEREIGNTY ==================== -->
  <g transform="translate(770, 75)">
    <rect class="box" width="180" height="70" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="14" y="26" class="t node-title" style="fill:#fbbf24">Cloud LLMs</text>
    <text x="14" y="44" class="t node-sub">OpenAI · Gemini</text>
    <rect x="14" y="49" width="152" height="15" rx="4" fill="#451a03"/>
    <text x="90" y="60" class="t mono" style="font-size:8.5px;font-weight:700;fill:#fde68a" text-anchor="middle">STRICT 100% PII REDACTION</text>
  </g>

  <!-- ==================== STAGE 4: BULLMQ / IN-MEMORY QUEUE ==================== -->
  <g transform="translate(770, 175)">
    <rect class="box" width="180" height="190" stroke="#8b5cf6" stroke-width="1.8"/>
    <rect x="14" y="16" width="36" height="36" rx="8" fill="#2e1065" stroke="#a855f7"/>
    <text x="32" y="39" class="t mono" style="font-size:18px;font-weight:700;fill:#c084fc" text-anchor="middle">⚡</text>
    <text x="14" y="74" class="t node-title">Async Worker Queue</text>
    <text x="14" y="93" class="t node-sub">BullMQ (Redis) / In-Memory</text>

    <g transform="translate(14, 108)">
      <rect class="badge-queue" width="152" height="46"/>
      <text x="8" y="17" class="t mono" style="font-size:10px;font-weight:700;fill:#d8b4fe">RECURSIVE CHUNKER</text>
      <text x="8" y="31" class="t mono" style="font-size:9px;fill:#e9d5ff">500 chars · 50 overlap</text>
      <text x="8" y="42" class="t mono" style="font-size:8.5px;fill:#c4b5fd">GET /api/ingest/status/:id</text>
    </g>
    <text x="14" y="172" class="t mono" style="font-size:9.5px;fill:#a855f7">Zero-Bloat Fallback Ready</text>
  </g>

  <!-- ==================== LOWER BRANCH: LOCAL LLM SOVEREIGNTY ==================== -->
  <g transform="translate(770, 395)">
    <rect class="box" width="180" height="70" stroke="#3ee6a8" stroke-width="1.5"/>
    <text x="14" y="26" class="t node-title" style="fill:#3ee6a8">Local In-House LLM</text>
    <text x="14" y="44" class="t node-sub">Ollama · Private VPC</text>
    <rect x="14" y="49" width="152" height="15" rx="4" fill="#064e3b"/>
    <text x="90" y="60" class="t mono" style="font-size:8.5px;font-weight:700;fill:#a7f3d0" text-anchor="middle">OPTIONAL ON-PREM REASONING</text>
  </g>

  <!-- ==================== STAGE 5: VECTOR STORE & SMLEngine ==================== -->
  <g transform="translate(1010, 175)">
    <rect class="box" width="154" height="190" stroke="#00f0ff" stroke-width="1.8"/>
    <rect x="14" y="16" width="36" height="36" rx="8" fill="#083344" stroke="#06b6d4"/>
    <text x="32" y="39" class="t mono" style="font-size:18px;font-weight:700;fill:#22d3ee" text-anchor="middle">🧠</text>
    <text x="14" y="74" class="t node-title">Vector Storage</text>
    <text x="14" y="93" class="t node-sub">Semantic Indexing</text>

    <g transform="translate(14, 108)">
      <rect width="126" height="24" rx="5" fill="#082f49"/>
      <text x="8" y="16" class="t mono" style="font-size:9.5px;fill:#38bdf8">all-MiniLM-L6-v2</text>
    </g>
    <g transform="translate(14, 138)">
      <rect width="126" height="24" rx="5" fill="#082f49"/>
      <text x="8" y="16" class="t mono" style="font-size:9.5px;fill:#38bdf8">384-Dim Embeddings</text>
    </g>
    <text x="14" y="176" class="t mono" style="font-size:9.5px;fill:#00f0ff">IVectorStoreAdapter</text>
  </g>

  <!-- ==================== LIVE PACKET ANIMATIONS ==================== -->
  <g filter="url(#glow)">
    <!-- Document payload into Magic Byte Filter -->
    <circle r="4" fill="#00f0ff">
      <animateMotion dur="1.8s" repeatCount="indefinite" path="M 190 270 H 260"/>
    </circle>
    <!-- Verified document into PIIGuard -->
    <circle r="4" fill="#10b981">
      <animateMotion dur="1.6s" begin="-0.5s" repeatCount="indefinite" path="M 440 270 H 500"/>
    </circle>
    <!-- Sanitized chunks into BullMQ Queue -->
    <circle r="4" fill="#8b5cf6">
      <animateMotion dur="1.5s" begin="-0.8s" repeatCount="indefinite" path="M 700 270 H 770"/>
    </circle>
    <!-- Embedded vectors into Vector Store -->
    <circle r="4" fill="#00f0ff">
      <animateMotion dur="1.4s" begin="-0.3s" repeatCount="indefinite" path="M 950 270 H 1010"/>
    </circle>
    <!-- Cloud Redacted Path -->
    <circle r="3.5" fill="#f59e0b">
      <animateMotion dur="2.4s" begin="-1.2s" repeatCount="indefinite" path="M 680 230 C 720 230 730 110 770 110 H 950"/>
    </circle>
    <!-- Local VPC Path -->
    <circle r="3.5" fill="#3ee6a8">
      <animateMotion dur="2.8s" begin="-1.6s" repeatCount="indefinite" path="M 680 310 C 720 310 730 430 770 430 H 950"/>
    </circle>
  </g>

  <!-- Footer Telemetry -->
  <g transform="translate(36, 515)">
    <text x="0" y="0" class="t mono" style="font-size:11px;fill:#64748b">
      BENCHMARK CONFIRMED: PIIGuard = 245K ops/sec (4.03 µs) · Cache = 7.2M ops/sec (0.1 µs) · Dot Product = 2.3M ops/sec (0.41 µs) · Zero Cloud Leakage
    </text>
  </g>
</svg>
