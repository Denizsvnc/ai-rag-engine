name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Typecheck, Test & Benchmark (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 5
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: rag_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d rag_test" --health-interval 5s
          --health-timeout 3s --health-retries 5
    env:
      PG_TEST_URL: postgresql://postgres:test-only-password@127.0.0.1:5432/rag_test
      REDIS_TEST_URL: redis://127.0.0.1:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Dependency Security Gate
        run: npm audit --audit-level=high

      - name: TypeScript Static Typecheck
        run: npm run typecheck

      - name: Execute Full Automated Test Suite
        run: npm test

      - name: Run High-Throughput Smoke Benchmark
        run: npm run benchmark

      - name: Build TypeScript Declarations and Bundles
        run: npm run build

      - name: Verify packed SDK as an independent customer project
        if: matrix.node-version == '22.x'
        timeout-minutes: 15
        run: npm run test:consumer

  docker-build:
    name: Docker Image Verification
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Multi-Stage Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ai-rag-engine:ci-test
