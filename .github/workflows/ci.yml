name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      real_model_consumer:
        description: Run the slower real-model packaged consumer integration
        type: boolean
        default: false

jobs:
  test:
    name: Typecheck, Test & Benchmark (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]

    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 5
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: rag_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d rag_test" --health-interval 5s
          --health-timeout 3s --health-retries 5
    env:
      PG_TEST_URL: postgresql://postgres:test-only-password@127.0.0.1:5432/rag_test
      REDIS_TEST_URL: redis://127.0.0.1:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Dependency Security Gate
        run: npm audit --audit-level=high

      - name: TypeScript Static Typecheck
        run: npm run typecheck

      - name: Cache local embedding model
        uses: actions/cache@v4
        with:
          path: data/models
          key: minilm-q8-transformers-4.3.1

      - name: Provision embedding model for integration tests
        run: node --import tsx --input-type=module -e "import { SMLEngine } from './src/core/sml-engine.ts'; await new SMLEngine().init();"

      - name: Execute Full Automated Test Suite
        run: npm test

      - name: Execute security regression tests with real Redis
        run: npm run test:security

      - name: Run High-Throughput Smoke Benchmark
        run: npm run benchmark

      - name: Build and verify npm allowlist, declarations and CLI assets
        run: npm run test:package

      - name: Inspect npm pack dry run
        run: npm pack --dry-run

      - name: Verify packed SDK as an independent customer project
        timeout-minutes: 15
        run: npm run test:consumer
        env:
          CONSUMER_MODEL_CACHE_DIR: ${{ github.workspace }}/data/models

  bun-test:
    name: Bun Runtime Compatibility
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install
      - name: Execute Bun Test Suite
        run: bun test test/bun/bun-compat.test.ts

  real-model-consumer:
    if: github.event_name == 'workflow_dispatch' && inputs.real_model_consumer
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: rag_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d rag_test" --health-interval 5s
          --health-timeout 3s --health-retries 5
    env:
      PG_TEST_URL: postgresql://postgres:test-only-password@127.0.0.1:5432/rag_test
      REDIS_TEST_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run test:consumer:integration

  docker-build:
    name: Docker Image Verification
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Multi-Stage Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ai-rag-engine:ci-test
